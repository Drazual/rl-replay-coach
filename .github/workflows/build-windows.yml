name: Build and release Windows app

# Every push to main builds RLCoach.exe. When the version in pyproject.toml is
# new, it also publishes a GitHub Release, which the app picks up and offers as
# an update.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  plugin:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get the BakkesMod SDK
        run: git clone --depth 1 https://github.com/bakkesmodorg/BakkesModSDK sdk
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build RLCoachLive.dll
        run: cl /nologo /LD /EHsc /std:c++17 /O2 /MD /DNDEBUG /utf-8 /I sdk\include plugin\RLCoachLive.cpp /link sdk\lib\pluginsdk.lib ws2_32.lib shell32.lib /OUT:RLCoachLive.dll
      - uses: actions/upload-artifact@v4
        with:
          name: RLCoachLive-plugin
          path: RLCoachLive.dll

  build:
    needs: plugin
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: RLCoachLive-plugin
          path: rlcoach/plugin
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path pyproject.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
          gh release view "v$v" 2>$null
          "is_new=$([int]($LASTEXITCODE -ne 0))" >> $env:GITHUB_OUTPUT
          exit 0
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Install
        run: python -m pip install ".[app,test]" pyinstaller
      - name: Unit tests
        run: python -m pytest -q tests
      - name: Build RLCoach.exe
        run: pyinstaller --noconfirm --onefile --windowed --name RLCoach --add-data "rlcoach\ui;rlcoach\ui" --add-data "rlcoach\plugin;rlcoach\plugin" --collect-all subtr_actor rlcoach_app.py
      - name: Smoke test
        shell: pwsh
        run: |
          $p = Start-Process dist\RLCoach.exe -ArgumentList "--no-window","--port","8799" -PassThru
          Start-Sleep 10
          $r = Invoke-WebRequest http://127.0.0.1:8799/ -UseBasicParsing
          if ($r.Content -notmatch "RL Coach") { throw "UI not served" }
          Stop-Process $p
      - uses: actions/upload-artifact@v4
        with:
          name: RLCoach-windows
          path: dist/RLCoach.exe
      - name: Publish release
        if: steps.ver.outputs.is_new == '1' && github.event_name == 'push'
        shell: pwsh
        run: gh release create "v${{ steps.ver.outputs.version }}" dist/RLCoach.exe rlcoach/plugin/RLCoachLive.dll --title "RL Coach v${{ steps.ver.outputs.version }}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
